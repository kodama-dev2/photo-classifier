<!DOCTYPE html>
<html lang="id" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data: pcimg:;"
    />
    <title>Photo Classifier</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
    </div>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">Face sorting</p>
          <h1>Photo Classifier</h1>
          <p class="lede">Kelompokkan foto ke folder per orang.</p>
        </div>
        <div class="topbar-right">
          <p id="model-status" class="status" data-state="loading" aria-live="polite">Memuat model…</p>
          <button type="button" class="icon-btn" id="theme-btn" aria-label="Ganti tema" title="Ganti tema">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" />
            </svg>
          </button>
        </div>
      </header>

      <section class="sheet sheet-setup" aria-labelledby="setup-title">
        <h2 id="setup-title" class="sr-only">Pengaturan</h2>

        <div class="folder-row">
          <label class="field">
            <span class="label">Sumber</span>
            <button type="button" class="path-btn" id="pick-input">
              <span id="input-path" class="path">Pilih folder foto</span>
            </button>
          </label>

          <div class="field destination">
            <span class="label">Tujuan</span>
            <div class="path-with-action">
              <button type="button" class="path-btn" id="pick-output">
                <span id="output-path" class="path">Pilih folder hasil</span>
              </button>
              <fieldset class="segment" aria-label="Aksi ke folder tujuan">
                <label><input type="radio" name="action" value="move" checked /><span>Pindah</span></label>
                <label><input type="radio" name="action" value="copy" /><span>Salin</span></label>
              </fieldset>
            </div>
          </div>

          <label class="field">
            <span class="label">Referensi <em>opsional</em></span>
            <button type="button" class="path-btn" id="pick-reference">
              <span id="reference-path" class="path">Subfolder per orang</span>
            </button>
          </label>
        </div>

        <div class="tune-row">
          <label class="field grow threshold-field" for="threshold">
            <span class="threshold-head">
              <span class="label">Ambang kecocokan</span>
              <span class="threshold-chip" id="threshold-value" aria-live="polite">0.58</span>
            </span>
            <span class="threshold-track">
              <input id="threshold" type="range" min="0.40" max="0.72" step="0.01" value="0.58" />
              <span class="threshold-ends" aria-hidden="true">
                <span>Longgar</span>
                <span>Ketat</span>
              </span>
            </span>
          </label>

          <fieldset class="field grow group-field">
            <legend class="label">Foto berisi beberapa orang</legend>
            <div class="radio-stack">
              <label><input type="radio" name="group-mode" value="group" checked /> Simpan di <code>_group</code></label>
              <label><input type="radio" name="group-mode" value="copy-each" /> Salin ke tiap folder orang</label>
            </div>
          </fieldset>

          <div class="scan-actions">
            <button type="button" class="btn primary glass-btn" id="scan-btn">Pindai</button>
            <button type="button" class="btn glass-btn" id="cancel-btn" hidden>Batalkan</button>
          </div>
        </div>
      </section>

      <section class="progress-wrap" id="progress-wrap" hidden>
        <div class="progress-label">
          <span id="progress-text">Menyiapkan…</span>
          <span id="progress-count"></span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <span id="progress-fill"></span>
        </div>
      </section>

      <p id="message" class="message" hidden role="status"></p>

      <section class="sheet results" id="results" hidden>
        <div class="results-bar">
          <div>
            <h2>Hasil</h2>
            <p class="stats" id="stats"></p>
          </div>
          <div class="results-bar-right">
            <div class="segment tabs" role="tablist" aria-label="Tampilan hasil">
              <button type="button" class="tab active" role="tab" id="tab-preview" aria-selected="true" aria-controls="panel-preview" data-view="preview">Pratinjau</button>
              <button type="button" class="tab" role="tab" id="tab-list" aria-selected="false" aria-controls="panel-list" data-view="list">Daftar</button>
            </div>
            <button type="button" class="btn" id="merge-btn" hidden>Gabungkan</button>
            <button type="button" class="btn primary" id="apply-btn">Terapkan</button>
            <button type="button" class="btn" id="undo-btn" hidden>Urungkan</button>
            <button type="button" class="link-btn" id="open-output-btn" hidden>Buka tujuan</button>
          </div>
        </div>

        <div class="view-panel" id="panel-preview" role="tabpanel" aria-labelledby="tab-preview">
          <div class="candidate-grid" id="candidate-grid"></div>
          <p class="preview-empty" id="preview-empty" hidden>Belum ada kandidat orang.</p>
        </div>

        <div class="view-panel" id="panel-list" role="tabpanel" aria-labelledby="tab-list" hidden>
          <table class="file-table">
            <thead>
              <tr>
                <th class="col-thumb"></th>
                <th>File</th>
                <th>Tujuan</th>
              </tr>
            </thead>
            <tbody id="file-rows"></tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
